name: Resume Reliability

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resume-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resume-reliability.yml'
  workflow_dispatch:

jobs:
  resume-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sanitized fixture intake
        run: npm run test:sanitized-fixture-intake

      - name: Run resume reliability gate
        run: npm run test:resume-reliability

      - name: Upload reliability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-reliability-reports
          path: .artifacts/resume-reliability/
          if-no-files-found: warn
          retention-days: 7
