name: Production Reliability

on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'jest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resume-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'jest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/resume-reliability.yml'
  workflow_dispatch:

jobs:
  production-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit and API tests
        run: npm test -- --runInBand

      - name: Validate sanitized fixture intake
        run: npm run test:sanitized-fixture-intake

      - name: Run resume reliability gate
        run: npm run test:resume-reliability

      - name: Browser E2E
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload reliability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-reliability-artifacts
          path: |
            .artifacts/resume-reliability/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
